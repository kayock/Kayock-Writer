name: Kayock Writer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: windows-2022
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tests/run_tests.py
      - run: python tests/test_upgrade.py
      - run: python tests/test_foundation.py
      - run: python tests/test_canon_api.py
      - run: python tests/test_streaming.py
      - run: python tests/verify_kayock_writer.py
